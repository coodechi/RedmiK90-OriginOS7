# ==============================================================================
# Property Patch Rules for OriginOS 7 on REDMI K90 (annibale)
# Target file: system/system/build.prop
# ==============================================================================

[remove]
# Remove iQOO Neo 11 Q2 dedicated display chip properties (not present on K90)
persist.vivo.displayic.ver
persist.vivo.displayic.name
# Remove Neo 11 144Hz private refresh rate override (K90 panel is 120Hz)
persist.sys.private_fps

[set]
# Align MediaCodec / Codec2 selection with K90 vendor AIDL HAL
debug.stagefright.ccodec=4
media.c2.hal.selection=aidl

# Align telephony default network mode with K90 odm/vendor (8+8 mode NR+LTE+CDMA+GSM)
ro.telephony.default_network=33,33

# Align display refresh rate & density with K90 hardware (1156x2510 @ 480dpi, 120Hz)
persist.vivo.phone.fps_max=120
ro.sf.lcd_density=480

# Disable Q2 frame-interpolation trigger in GameCube
persist.vivo.gamecube.support_fps=0

# Disable removed Neo 11 hardware-specific 4D game vibrator & COTA hooks
ro.vivo.vivo4dgamevib.enable=0
ro.vivo.cota.enable=0

# Ensure direct /oem/oem.prop & /vgc/vgc.prop imports are active
ro.vivo.oem.support=yes
ro.vivo.vgc.activate=true

[debug_set]
# Applied ONLY when build input debug_adb=true (v1 bring-up diagnostics)
# Enables early passwordless USB ADB logcat & prevents RescueParty bootloop wipes
ro.adb.secure=0
ro.debuggable=1
ro.force.debuggable=1
persist.sys.usb.config=mtp,adb
persist.service.adb.enable=1
persist.service.debuggable=1
persist.sys.disable_rescue=true
